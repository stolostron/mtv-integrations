apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: openshift-cnv
  namespace: {{ .Values.global.namespace }}
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: acm/cnv-operator-install
              operator: In
              values:
                - "true"
            - key: acm/cnv-operator-manual-install
              operator: NotIn
              values:
                - "true"
    - requiredClusterSelector: # This is for "Fleet virtualization" in the console
        labelSelector:
          matchLabels:
            local-cluster: "true"
