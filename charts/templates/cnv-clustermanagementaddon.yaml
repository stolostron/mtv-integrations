apiVersion: addon.open-cluster-management.io/v1beta1
kind: ClusterManagementAddOn
metadata:
  name: kubevirt-hyperconverged
  annotations:
    addon.open-cluster-management.io/lifecycle: "addon-manager"
spec:
  addOnMeta:
    description: Kubevirt Hyperconverged
    displayName: Kubevirt Hyperconverged
  defaultConfigs:
    - group: addon.open-cluster-management.io
      resource: addontemplates
      name: kubevirt-hyperconverged
    - group: addon.open-cluster-management.io
      resource: addondeploymentconfigs
      name: kubevirt-hyperconverged-template-values
      namespace: {{ .Values.global.namespace }}
  installStrategy:
    type: Placements
    placements:
    - name: openshift-cnv
      namespace: {{ .Values.global.namespace }}
---
# Supplies the opening delimiter used by the managed ConfigurationPolicy's
# Go template after AddOnTemplate rendering.
apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnDeploymentConfig
metadata:
  name: kubevirt-hyperconverged-template-values
  namespace: {{ .Values.global.namespace }}
spec:
  # Preserve the namespace declared by the AddOnTemplate instead of using the
  # addon manager default open-cluster-management-agent-addon namespace.
  agentInstallNamespace: ""
  customizedVariables:
    - name: HCO_TEMPLATE_START
      value: '{{`{{ print "{" "{" }}`}}'
