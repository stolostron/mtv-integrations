apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnTemplate
metadata:
  name: proxy-cclm
spec:
  addonName: proxy-cclm
  agentSpec:
    manifestConfigs:
      - resourceIdentifier:
          group: policy.open-cluster-management.io
          resource: configurationpolicies
          name: proxy-cclm-kubevirt-config
          namespace: open-cluster-management-policies
        updateStrategy:
          type: CreateOnly
      - resourceIdentifier:
          group: ""
          resource: services
          name: virt-synchronization-controller
          namespace: openshift-cnv
        updateStrategy:
          type: CreateOnly
      - resourceIdentifier:
          group: route.openshift.io
          resource: routes
          name: virt-synchronization-endpoint
          namespace: openshift-cnv
        updateStrategy:
          type: CreateOnly
    workload:
      manifests:
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: proxy-cclm-policy-manager
            namespace: open-cluster-management-policies
          rules:
            - apiGroups: ["policy.open-cluster-management.io"]
              resources: ["configurationpolicies"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: proxy-cclm-policy-manager-hosted-binding
            namespace: open-cluster-management-policies
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: proxy-cclm-policy-manager
          subjects:
            - kind: ServiceAccount
              name: klusterlet-{{CLUSTER_NAME}}-work-sa
              namespace: open-cluster-management-{{CLUSTER_NAME}}
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: proxy-cclm-policy-manager-binding
            namespace: open-cluster-management-policies
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: proxy-cclm-policy-manager
          subjects:
            - kind: ServiceAccount
              name: klusterlet-work-sa
              namespace: open-cluster-management-agent
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          metadata:
            name: proxy-cclm-kubevirt-config
            namespace: open-cluster-management-policies
          spec:
            remediationAction: enforce
            severity: low
            pruneObjectBehavior: None
            evaluationInterval:
              compliant: 1m
              noncompliant: 30s
            object-templates:
              - complianceType: musthave
                objectDefinition:
                  apiVersion: kubevirt.io/v1
                  kind: KubeVirt
                  metadata:
                    name: kubevirt-kubevirt-hyperconverged
                    namespace: openshift-cnv
                  spec:
                    configuration:
                      developerConfiguration:
                        featureGates:
                          - CrossClusterMigrationProxy
                      migrations:
                        decentralizedLiveMigrationDatapath: Proxy
        - apiVersion: v1
          kind: Service
          metadata:
            name: virt-synchronization-controller
            namespace: openshift-cnv
            labels:
              kubevirt.io/synchronization-endpoint: "true"
          spec:
            selector:
              kubevirt.io: virt-synchronization-controller
            ports:
              - name: grpc
                port: 9185
                protocol: TCP
                targetPort: sync
            type: ClusterIP
        - apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: virt-synchronization-endpoint
            namespace: openshift-cnv
            labels:
              kubevirt.io/synchronization-endpoint: "true"
          spec:
            to:
              kind: Service
              name: virt-synchronization-controller
            port:
              targetPort: grpc
            tls:
              termination: passthrough
              insecureEdgeTerminationPolicy: None
    deleteOption:
      propagationPolicy: SelectivelyOrphan
      selectivelyOrphans:
        orphaningRules:
          - group: ""
            resource: services
            namespace: openshift-cnv
            name: virt-synchronization-controller
          - group: route.openshift.io
            resource: routes
            namespace: openshift-cnv
            name: virt-synchronization-endpoint
