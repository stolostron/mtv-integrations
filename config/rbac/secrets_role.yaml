# Role scoped to the mtv-integrations namespace for provider-secret lifecycle management.
# Write access to Secrets (create/update/patch/delete) is intentionally NOT granted
# cluster-wide in the manager ClusterRole; it is restricted to this namespace only so
# that a compromised controller cannot modify Secrets in arbitrary namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: mtv-integrations
    app.kubernetes.io/managed-by: kustomize
  name: mtv-integrations-secrets-role
  namespace: system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
