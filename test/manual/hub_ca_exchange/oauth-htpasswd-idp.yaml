# Dev-hub only: enables login for ca-exchange-u2/u3/u4 (secret ca-exchange-htpasswd in openshift-config).
# Remove identityProviders from oauth/cluster when rolling back manual tests.
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    - name: ca-exchange-htpasswd
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: ca-exchange-htpasswd