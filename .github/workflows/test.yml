name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
  webhook-test:
    runs-on: ubuntu-latest
    env:
      KIND_NAME: kind-cluster
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Running Tests
        run: |
          openssl version
          export CONTAINER_TOOL=docker
          make prepare-webhook-test
          make run-webhook-test
  provider-crd-test:
    runs-on: ubuntu-latest
    env:
      KIND_NAME: kind-cluster
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Running Tests
        run: |
          make prepare-e2e-test
          make run-provider-crd-test

  e2e-test:
    runs-on: ubuntu-latest
    env:
      KIND_NAME: kind-cluster
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Running Tests
        run: |
          make prepare-e2e-test
          make run-e2e-test
  sonarcloud:
    runs-on: ubuntu-latest
    needs:
      - e2e-test
      - webhook-test
      - test
      - provider-crd-test
    steps:
      - run: echo "Running SonarCloud analysis..."
      - name: Upload artifacts for the sonarcloud workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts
          path: |
            coverage*.out
            report*.json
